<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社会テスト対策｜通常＋変態モード</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#202938;--muted:#6c7483;--line:#dde3eb;--main:#315fd5;--ok:#16784a;--ng:#b63838;--hard:#7b2cbf;--hardbg:#f5edff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
header{background:#17233d;color:#fff;padding:26px 15px}
header>div,main,footer{max-width:850px;margin:auto}
h1{margin:0 0 6px;font-size:27px} header p{margin:0;color:#d8e0f0}
main{padding:18px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:13px;font-weight:800}
select,input{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--main);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button.secondary{background:#e8edf7;color:#283752}
button.hardbtn{background:var(--hard)}
button:disabled{opacity:.5;cursor:default}
.hint,.pool{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.stats strong{display:block;font-size:21px} .stats span{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;background:#eef3ff;color:#3156a5;border-radius:999px;padding:5px 9px}
.badge.hard{background:var(--hardbg);color:var(--hard);font-weight:900}
.count{font-size:13px;color:var(--muted);font-weight:700}
h2{font-size:20px;line-height:1.65;margin:14px 0}
.choices{display:grid;gap:9px}
.choice{width:100%;text-align:left;background:#f8f9fc;color:var(--text);border:1px solid var(--line)}
.choice.correct{background:#e9f8f0;border:1px solid #88cba5;color:#125d39}
.choice.wrong{background:#fff0f0;border:1px solid #dc9999;color:#8c2929}
.textrow{display:flex;gap:8px} .textrow input{margin:0}
.feedback{margin-top:14px;padding:14px;border-radius:12px;line-height:1.75}
.feedback.ok{background:#ecf9f2;border:1px solid #acdcbf}
.feedback.ng{background:#fff2f2;border:1px solid #e4acac}
.source{font-size:13px;color:#4e5969;margin-top:8px}
.next{display:flex;justify-content:flex-end;margin-top:14px}
.mode-note{padding:11px 13px;border-radius:12px;background:#f7f1ff;border:1px solid #dcc6f5;color:#5f278e;font-size:13px;line-height:1.6;margin-top:12px}
footer{padding:0 14px 30px;color:var(--muted);font-size:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.textrow{flex-direction:column}}
</style>
</head>
<body>
<header><div>
<h1>社会テスト対策</h1>
<p>通常 180問 ＋ 変態モード 73問｜1問ずつ解く形式</p>
</div></header>
<main>
<section class="card">
<div class="grid">
<label>モード
<select id="mode">
<option value="normal">通常モード</option>
<option value="hentai">変態モード</option>
<option value="mix">通常＋変態ミックス</option>
</select></label>
<label>単元<select id="unit"><option value="all">すべて</option></select></label>
<label>形式<select id="type"><option value="all">すべて</option><option value="choice">四択</option><option value="text">記述</option></select></label>
<label>出題数<select id="count"><option value="10">10問</option><option value="20" selected>20問</option><option value="40">40問</option><option value="80">80問</option><option value="120">120問</option><option value="all">全問</option></select></label>
</div>
<div class="buttons">
<button id="start">テストを始める</button>
<button id="previousWrong" class="secondary">前回の間違いだけ</button>
</div>
<p class="pool" id="poolInfo"></p>
<div class="mode-note"><b>変態モード：</b>本文の主語句だけではなく、図表の数字・写真キャプション・欄外・小さな資料・作品名・細かな年次まで狙います。通常テストではまず出なさそうな場所を優先しています。</div>
<p class="hint">表示は必ず1問だけです。回答 → 解説・出典確認 →「次の問題」で進みます。</p>
</section>

<section id="stats" class="card stats hidden">
<div><strong id="pos">1 / 20</strong><span>現在</span></div>
<div><strong id="ok">0</strong><span>正解</span></div>
<div><strong id="ng">0</strong><span>不正解</span></div>
<div><strong id="rate">0%</strong><span>正答率</span></div>
</section>

<div id="screen"></div>

<section id="result" class="card hidden">
<h2>結果</h2><p id="resultText"></p>
<div class="buttons"><button id="again">もう一度</button><button id="wrongOnly" class="secondary">今回の間違いだけ</button></div>
</section>
</main>
<footer>出典ページは、送付された教科書写真をもとに表示しています。図表・欄外を使う変態問題では図番号もできるだけ併記しています。</footer>

<script>
const QUESTIONS=[{"id": 1, "unit": "大衆社会と大衆文化", "type": "choice", "q": "1920年代のアメリカで、大量生産と大量消費の広がりを象徴する製品として最も適切なものはどれ？", "choices": ["自動車", "蒸気機関車", "帆船", "蓄音機"], "answer": 0, "ex": "自動車、とくにフォード式大量生産は大衆消費社会の象徴です。大量生産で価格が下がり、一般家庭にも普及しました。", "src": ["教科書① p.108-109「アメリカの大衆消費社会」", "教科書② p.220-221「新しい文化と生活」"], "mode": "normal", "difficulty": "通常"}, {"id": 2, "unit": "大衆社会と大衆文化", "type": "choice", "q": "大量生産が大衆消費社会につながった理由として最も適切なものはどれ？", "choices": ["商品の価格が下がり、多くの人が買えるようになったから", "政府がすべての商品を無料配布したから", "農業人口が増えたから", "輸入品が全面禁止されたから"], "answer": 0, "ex": "大量生産によって製品1個あたりのコストが下がり、より多くの人が商品を購入できるようになりました。", "src": ["教科書① p.109「大衆消費社会とマスメディア」"], "mode": "normal", "difficulty": "通常"}, {"id": 3, "unit": "大衆社会と大衆文化", "type": "choice", "q": "1920年代のアメリカで普及したマスメディアの組み合わせとして正しいものはどれ？", "choices": ["ラジオ・映画", "電報・のろし", "木版画・瓦版", "SNS・動画配信"], "answer": 0, "ex": "1920年代には映画やラジオが広く普及し、大衆文化を全国に広げました。", "src": ["教科書① p.109「大衆消費社会とマスメディア」"], "mode": "normal", "difficulty": "通常"}, {"id": 4, "unit": "大衆社会と大衆文化", "type": "text", "q": "1920年代のアメリカで、短い髪型や活動的な服装など新しい生活様式を示した若い女性を何と呼ぶ？", "answers": ["フラッパー"], "ex": "フラッパーは1920年代アメリカの新しい女性像を象徴します。", "src": ["教科書① p.108「アメリカのフラッパー」"], "mode": "normal", "difficulty": "通常"}, {"id": 5, "unit": "大衆社会と大衆文化", "type": "choice", "q": "日本で『モガ』と呼ばれたのはどのような人？", "choices": ["洋装など新しい都市文化を楽しむ若い女性", "農村の地主", "軍人", "小学校教師"], "answer": 0, "ex": "モガは『モダンガール』の略で、都市で新しい服装や生活様式を楽しむ女性を指します。", "src": ["教科書① p.108, p.110「モダンガール」"], "mode": "normal", "difficulty": "通常"}, {"id": 6, "unit": "大衆社会と大衆文化", "type": "text", "q": "1923年に東京・横浜を中心に大きな被害を出した災害名を答えよ。", "answers": ["関東大震災"], "ex": "1923年の関東大震災は都市復興や社会の変化にも大きな影響を与えました。", "src": ["教科書① p.110「関東大震災」", "教科書② p.221「関東大震災」"], "mode": "normal", "difficulty": "通常"}, {"id": 7, "unit": "大衆社会と大衆文化", "type": "choice", "q": "関東大震災後の東京で進められたこととして正しいものはどれ？", "choices": ["大規模な都市復興・都市計画", "江戸幕府の再建", "鎖国の再開", "首都の京都移転"], "answer": 0, "ex": "震災後、東京では都市計画にもとづく復興が進み、道路整備など都市の近代化が進みました。", "src": ["教科書① p.110「日本の都市化と大衆文化」"], "mode": "normal", "difficulty": "通常"}, {"id": 8, "unit": "大衆社会と大衆文化", "type": "text", "q": "日本でラジオ放送が始まった年を西暦で答えよ。", "answers": ["1925", "1925年"], "ex": "日本のラジオ放送は1925年に東京・大阪・名古屋で始まり、その後全国へ普及しました。", "src": ["教科書① p.111「日本のマスメディア」", "教科書② p.221「メディアの発達と文化の大衆化」"], "mode": "normal", "difficulty": "通常"}, {"id": 9, "unit": "大衆社会と大衆文化", "type": "choice", "q": "大衆文化の発展を支えた背景として適切でないものはどれ？", "choices": ["教育の普及", "新聞・雑誌の普及", "ラジオ放送の開始", "識字率の大幅低下"], "answer": 3, "ex": "教育の普及で文字を読める人が増え、新聞・雑誌などの読者層が拡大しました。", "src": ["教科書① p.111「日本のマスメディア」", "教科書② p.220-221"], "mode": "normal", "difficulty": "通常"}, {"id": 10, "unit": "大衆社会と大衆文化", "type": "text", "q": "『大量生産→価格低下→大量消費→広告やマスメディアの発達』という流れから成立した社会を何という？", "answers": ["大衆消費社会", "大量消費社会"], "ex": "大量生産された商品を一般の人々が広く消費する大衆消費社会が成立しました。", "src": ["教科書① p.109「大衆消費社会とマスメディア」"], "mode": "normal", "difficulty": "通常"}, {"id": 11, "unit": "世界恐慌と各国の対応", "type": "text", "q": "世界恐慌のきっかけとなった、1929年10月の株価大暴落が起きた都市を答えよ。", "answers": ["ニューヨーク", "ニューヨーク市"], "ex": "1929年10月、ニューヨークのウォール街で株価が大暴落し、世界恐慌のきっかけとなりました。", "src": ["教科書① p.114-115「大恐慌とその波及」", "教科書② p.222「世界恐慌の始まり」"], "mode": "normal", "difficulty": "通常"}, {"id": 12, "unit": "世界恐慌と各国の対応", "type": "choice", "q": "世界恐慌がアメリカから世界へ広がった理由として最も適切なものはどれ？", "choices": ["アメリカが海外に投資していた資金を引き揚げたから", "アメリカが鎖国したから", "世界中で同時に自然災害が起きたから", "各国が金本位制を一斉に廃止したから"], "answer": 0, "ex": "アメリカは各国へ資金を貸していたため、それを引き揚げるとヨーロッパなどにも不況が波及しました。", "src": ["教科書① p.115「大恐慌とその波及」"], "mode": "normal", "difficulty": "通常"}, {"id": 13, "unit": "世界恐慌と各国の対応", "type": "text", "q": "アメリカで1933年からニューディール政策を進めた大統領を答えよ。", "answers": ["フランクリン・ローズベルト", "フランクリン＝ローズベルト", "ローズベルト"], "ex": "フランクリン＝ローズベルト大統領は、政府が積極的に経済へ介入するニューディール政策を進めました。", "src": ["教科書① p.115-116「ニューディールの展開」", "教科書② p.222"], "mode": "normal", "difficulty": "通常"}, {"id": 14, "unit": "世界恐慌と各国の対応", "type": "choice", "q": "ニューディール政策の説明として正しいものはどれ？", "choices": ["政府が公共事業などを行い、失業者を救済した", "政府が経済に一切介入しなかった", "植民地だけで経済圏を作った", "軍部に政治を任せた"], "answer": 0, "ex": "ニューディールでは、公共事業・農業調整・労働者保護など、政府の積極的な介入が行われました。", "src": ["教科書① p.115-116「ニューディールの展開」"], "mode": "normal", "difficulty": "通常"}, {"id": 15, "unit": "世界恐慌と各国の対応", "type": "text", "q": "ニューディール政策の公共事業として有名な、テネシー川流域開発公社の略称を答えよ。", "answers": ["TVA", "ＴＶＡ", "tva"], "ex": "TVAはダム建設などを行い、雇用創出や地域開発を進めました。", "src": ["教科書① p.116「テネシー川流域開発公社（TVA）」"], "mode": "normal", "difficulty": "通常"}, {"id": 16, "unit": "世界恐慌と各国の対応", "type": "choice", "q": "イギリスやフランスが恐慌対策として進めた政策はどれ？", "choices": ["ブロック経済", "ニューディール政策", "五か年計画", "国家総動員法"], "answer": 0, "ex": "イギリスやフランスは、本国と植民地を一つの経済圏として囲い込むブロック経済を進めました。", "src": ["教科書② p.223「ブロック経済」", "教科書① p.118-119"], "mode": "normal", "difficulty": "通常"}, {"id": 17, "unit": "世界恐慌と各国の対応", "type": "text", "q": "本国と植民地などを経済圏として囲い込み、外部に高い関税をかける政策を何という？", "answers": ["ブロック経済"], "ex": "世界恐慌後、イギリスやフランスは広い植民地を利用してブロック経済を形成しました。", "src": ["教科書② p.223「ブロック経済」"], "mode": "normal", "difficulty": "通常"}, {"id": 18, "unit": "世界恐慌と各国の対応", "type": "choice", "q": "ブロック経済の拡大によって特に不利になりやすかった国の組み合わせはどれ？", "choices": ["ドイツ・イタリア・日本", "イギリス・フランス", "アメリカ・カナダ", "ブラジル・アルゼンチン"], "answer": 0, "ex": "植民地や資源の少ないドイツ・イタリア・日本は、ブロック経済の中で不利な立場となり、対外進出を強めました。", "src": ["教科書① p.118-119「ファシズムの伸長と共産主義」", "教科書② p.223-225"], "mode": "normal", "difficulty": "通常"}, {"id": 19, "unit": "世界恐慌と各国の対応", "type": "text", "q": "世界恐慌後、日本で深刻化した不況を何という？", "answers": ["昭和恐慌"], "ex": "日本では世界恐慌の影響などにより昭和恐慌が深刻化し、都市の失業や農村の窮乏が進みました。", "src": ["教科書① p.116-117「昭和恐慌の発生」「恐慌からの脱出」", "教科書② p.226"], "mode": "normal", "difficulty": "通常"}, {"id": 20, "unit": "世界恐慌と各国の対応", "type": "choice", "q": "昭和恐慌の農村でみられた深刻な社会問題として教科書にあるものはどれ？", "choices": ["欠食児童や娘の身売り", "人口の急増による住宅不足のみ", "米価の急騰による地主の没落だけ", "海外旅行ブーム"], "answer": 0, "ex": "農産物価格の暴落で農村が困窮し、欠食児童や娘の身売りなどが社会問題となりました。", "src": ["教科書① p.117「恐慌からの脱出」", "教科書② p.226-227"], "mode": "normal", "difficulty": "通常"}, {"id": 21, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "日本の恐慌脱出政策を進めた蔵相を答えよ。", "answers": ["高橋是清"], "ex": "高橋是清は金輸出再禁止や積極財政などを進め、日本は比較的早く恐慌から回復しました。", "src": ["教科書① p.117「恐慌からの脱出」"], "mode": "normal", "difficulty": "通常"}, {"id": 22, "unit": "ファシズムと軍部の台頭", "type": "choice", "q": "ファシズムの特徴として最も適切なものはどれ？", "choices": ["国家や指導者を重視し、自由や民主主義を制限する", "議会政治と個人の自由を最優先する", "植民地をすべて放棄する", "完全な地方自治を進める"], "answer": 0, "ex": "ファシズムは強力な指導者と国家を重視し、反対勢力や自由を制限する政治体制・運動です。", "src": ["教科書② p.224-225「欧米の情勢とファシズム」", "教科書① p.118-121"], "mode": "normal", "difficulty": "通常"}, {"id": 23, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "1922年にイタリアで政権を握ったファシスト党の指導者を答えよ。", "answers": ["ムッソリーニ", "ベニート・ムッソリーニ", "ベニート＝ムッソリーニ"], "ex": "ムッソリーニはファシスト党を率いて政権を握り、独裁体制を築きました。", "src": ["教科書① p.118-120「ファシズムの伸長と共産主義」", "教科書② p.224"], "mode": "normal", "difficulty": "通常"}, {"id": 24, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "1933年にドイツで首相となったナチスの指導者を答えよ。", "answers": ["ヒトラー", "アドルフ・ヒトラー", "アドルフ＝ヒトラー"], "ex": "ヒトラーは1933年に首相となり、ナチス独裁体制を強めました。", "src": ["教科書① p.119-121「ファシズムの出現」", "教科書② p.225"], "mode": "normal", "difficulty": "通常"}, {"id": 25, "unit": "ファシズムと軍部の台頭", "type": "choice", "q": "ナチスが行った政策として誤っているものはどれ？", "choices": ["ユダヤ人迫害", "再軍備", "言論・集会の自由の制限", "多党制の拡大"], "answer": 3, "ex": "ナチスは他政党を禁止し、独裁体制を強めました。多党制の拡大とは逆です。", "src": ["教科書① p.119-121", "教科書② p.225"], "mode": "normal", "difficulty": "通常"}, {"id": 26, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "ナチスによるユダヤ人などへの大量虐殺を何という？", "answers": ["ホロコースト"], "ex": "第二次世界大戦中、ナチスはユダヤ人などを強制収容所へ送り、大量虐殺を行いました。", "src": ["教科書② p.233「アウシュビッツ強制収容所」"], "mode": "normal", "difficulty": "通常"}, {"id": 27, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "ソ連で五か年計画などを進めた指導者を答えよ。", "answers": ["スターリン"], "ex": "スターリンのもとで重工業化や農業の集団化が進められました。", "src": ["教科書① p.118-121「ファシズムの伸長と共産主義」"], "mode": "normal", "difficulty": "通常"}, {"id": 28, "unit": "ファシズムと軍部の台頭", "type": "choice", "q": "スペイン内戦でフランコ側を支援した国の組み合わせはどれ？", "choices": ["ドイツ・イタリア", "イギリス・フランス", "アメリカ・ソ連", "日本・中国"], "answer": 0, "ex": "ドイツとイタリアはフランコ側を支援しました。反ファシズム側には国際旅団などが加わりました。", "src": ["教科書① p.120-121「スペイン内戦と国際情勢」"], "mode": "normal", "difficulty": "通常"}, {"id": 29, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "1931年、関東軍が南満州鉄道の線路爆破をきっかけに始めた軍事行動を何という？", "answers": ["満州事変"], "ex": "1931年の満州事変をきっかけに、日本軍は満州で占領地域を拡大しました。", "src": ["教科書① p.122-123「満州事変と軍部の台頭」", "教科書② p.228"], "mode": "normal", "difficulty": "通常"}, {"id": 30, "unit": "ファシズムと軍部の台頭", "type": "text", "q": "1932年、日本の強い影響下で建国された国を答えよ。", "answers": ["満州国"], "ex": "1932年、溥儀を元首として満州国が建国されましたが、実質的には日本の強い影響下にありました。", "src": ["教科書① p.122-123", "教科書② p.228"], "mode": "normal", "difficulty": "通常"}, {"id": 31, "unit": "日中戦争と戦時体制", "type": "text", "q": "満州国の元首となった、清朝最後の皇帝を答えよ。", "answers": ["溥儀"], "ex": "清朝最後の皇帝だった溥儀が満州国の元首となりました。", "src": ["教科書① p.123「南京国民政府の成立」付近資料"], "mode": "normal", "difficulty": "通常"}, {"id": 32, "unit": "日中戦争と戦時体制", "type": "text", "q": "満州事変を調査するため国際連盟が派遣した調査団を何という？", "answers": ["リットン調査団", "リットン"], "ex": "国際連盟はリットン調査団を派遣し、満州事変を調査しました。", "src": ["教科書① p.123「南京国民政府の成立」周辺", "教科書② p.228"], "mode": "normal", "difficulty": "通常"}, {"id": 33, "unit": "日中戦争と戦時体制", "type": "text", "q": "日本が国際連盟脱退を表明した年を答えよ。", "answers": ["1933", "1933年"], "ex": "国際連盟総会の勧告に反発した日本は、1933年に国際連盟脱退を表明しました。", "src": ["教科書① p.123「南京国民政府の成立」周辺", "教科書② p.228"], "mode": "normal", "difficulty": "通常"}, {"id": 34, "unit": "日中戦争と戦時体制", "type": "choice", "q": "1932年の五・一五事件で暗殺された首相は誰？", "choices": ["犬養毅", "東条英機", "原敬", "吉田茂"], "answer": 0, "ex": "五・一五事件では海軍青年将校らが首相・犬養毅を殺害し、政党内閣の時代が終わっていきました。", "src": ["教科書① p.124-125「軍部の発言力の高まり」", "教科書② p.229"], "mode": "normal", "difficulty": "通常"}, {"id": 35, "unit": "日中戦争と戦時体制", "type": "text", "q": "1936年、陸軍青年将校らが東京中心部を占拠した事件を何という？", "answers": ["二・二六事件", "二二六事件", "2・26事件"], "ex": "二・二六事件は鎮圧されましたが、その後軍部の政治的発言力はさらに強まりました。", "src": ["教科書① p.124-125「軍部の発言力の高まり」", "教科書② p.229"], "mode": "normal", "difficulty": "通常"}, {"id": 36, "unit": "日中戦争と戦時体制", "type": "text", "q": "1937年、日中戦争のきっかけとなった事件を何という？", "answers": ["盧溝橋事件"], "ex": "北京郊外の盧溝橋付近での日中両軍の衝突をきっかけに、日中戦争が始まりました。", "src": ["教科書① p.128-130「日中戦争と戦時体制」", "教科書② p.230"], "mode": "normal", "difficulty": "通常"}, {"id": 37, "unit": "日中戦争と戦時体制", "type": "choice", "q": "日中戦争の長期化につながった中国側の動きはどれ？", "choices": ["国民党と共産党が協力した", "清朝が復活した", "中国が国際連盟を脱退した", "中国が日本と軍事同盟を結んだ"], "answer": 0, "ex": "蒋介石の国民党と毛沢東の共産党が協力する第二次国共合作により、日本への抵抗が強まりました。", "src": ["教科書① p.130「日中戦争の開始と長期化」", "教科書② p.230"], "mode": "normal", "difficulty": "通常"}, {"id": 38, "unit": "日中戦争と戦時体制", "type": "text", "q": "中国国民党と中国共産党が日本に対抗して協力した体制を何という？", "answers": ["第二次国共合作"], "ex": "1937年、国民党と共産党が協力して抗日民族統一戦線を形成しました。", "src": ["教科書① p.130", "教科書② p.230"], "mode": "normal", "difficulty": "通常"}, {"id": 39, "unit": "日中戦争と戦時体制", "type": "text", "q": "1938年、政府が人や物資を戦争のために広く動員できるようにした法律を答えよ。", "answers": ["国家総動員法"], "ex": "国家総動員法により、政府は議会の承認なしに労働力や物資を動員できるようになりました。", "src": ["教科書① p.131「戦時体制を整える」", "教科書② p.231"], "mode": "normal", "difficulty": "通常"}, {"id": 40, "unit": "日中戦争と戦時体制", "type": "text", "q": "1940年、政党を解散させ、国民を戦争協力へ組織するためにつくられた団体を答えよ。", "answers": ["大政翼賛会"], "ex": "近衛内閣のもとで大政翼賛会が結成され、戦時体制が強化されました。", "src": ["教科書① p.131", "教科書② p.231"], "mode": "normal", "difficulty": "通常"}, {"id": 41, "unit": "第二次世界大戦", "type": "text", "q": "第二次世界大戦の直接のきっかけとなった、1939年9月のドイツによる侵攻先を答えよ。", "answers": ["ポーランド"], "ex": "ドイツのポーランド侵攻に対し、イギリス・フランスが宣戦布告して第二次世界大戦が始まりました。", "src": ["教科書① p.126-127「第二次世界大戦の勃発」", "教科書② p.232"], "mode": "normal", "difficulty": "通常"}, {"id": 42, "unit": "第二次世界大戦", "type": "choice", "q": "第二次世界大戦開戦前、イギリスやフランスがドイツに対してとった、戦争回避を優先する政策は？", "choices": ["宥和政策", "鎖国政策", "ニューディール", "農地改革"], "answer": 0, "ex": "イギリスやフランスは、ドイツの要求にある程度譲歩して戦争を避けようとする宥和政策をとりました。", "src": ["教科書① p.126-127"], "mode": "normal", "difficulty": "通常"}, {"id": 43, "unit": "第二次世界大戦", "type": "text", "q": "1940年に日本・ドイツ・イタリアが結んだ同盟を答えよ。", "answers": ["日独伊三国同盟"], "ex": "日独伊三国同盟により、日本はヨーロッパの枢軸国との結びつきを強めました。", "src": ["教科書① p.128-129", "教科書② p.232-234"], "mode": "normal", "difficulty": "通常"}, {"id": 44, "unit": "第二次世界大戦", "type": "choice", "q": "枢軸国の中心となった3国はどれ？", "choices": ["日本・ドイツ・イタリア", "アメリカ・イギリス・ソ連", "中国・フランス・アメリカ", "日本・イギリス・ドイツ"], "answer": 0, "ex": "枢軸国の中心は日本・ドイツ・イタリアです。", "src": ["教科書② p.232-235"], "mode": "normal", "difficulty": "通常"}, {"id": 45, "unit": "第二次世界大戦", "type": "text", "q": "ドイツが1941年にソ連へ侵攻したことで始まった戦争を一般に何という？", "answers": ["独ソ戦"], "ex": "1941年6月、ドイツは独ソ不可侵条約を破ってソ連に侵攻し、独ソ戦が始まりました。", "src": ["教科書② p.233"], "mode": "normal", "difficulty": "通常"}, {"id": 46, "unit": "第二次世界大戦", "type": "text", "q": "1941年、アメリカのローズベルト大統領とイギリスのチャーチル首相が発表した戦後構想を答えよ。", "answers": ["大西洋憲章"], "ex": "大西洋憲章では、戦後の国際秩序に関する基本原則が示されました。", "src": ["教科書① p.128-129「第二次世界大戦と日本・アメリカ」", "教科書② p.233"], "mode": "normal", "difficulty": "通常"}, {"id": 47, "unit": "第二次世界大戦", "type": "choice", "q": "ドイツ占領下のヨーロッパで起こった抵抗運動を何という？", "choices": ["レジスタンス", "ブロック経済", "ニューディール", "翼賛運動"], "answer": 0, "ex": "各地でドイツ占領に抵抗するレジスタンス運動が行われました。", "src": ["教科書② p.233"], "mode": "normal", "difficulty": "通常"}, {"id": 48, "unit": "第二次世界大戦", "type": "choice", "q": "1943年に最初に降伏した主要な枢軸国はどこ？", "choices": ["イタリア", "ドイツ", "日本", "スペイン"], "answer": 0, "ex": "1943年、イタリアが降伏。ドイツは1945年5月、日本は1945年8月に降伏しました。", "src": ["教科書② p.238-239「戦争の終結」"], "mode": "normal", "difficulty": "通常"}, {"id": 49, "unit": "第二次世界大戦", "type": "text", "q": "1944年、連合軍がフランス解放の足がかりとして行った上陸作戦を何という？", "answers": ["ノルマンディー上陸作戦", "ノルマンディー上陸"], "ex": "1944年6月のノルマンディー上陸作戦は、西ヨーロッパ解放の大きな転換点となりました。", "src": ["教科書① p.127-131「第二次世界大戦の展開」", "教科書② p.238"], "mode": "normal", "difficulty": "通常"}, {"id": 50, "unit": "第二次世界大戦", "type": "text", "q": "ドイツが降伏したのは何年何月？", "answers": ["1945年5月", "1945 5", "1945年5"], "ex": "ソ連軍や米英軍に追い詰められ、ドイツは1945年5月に降伏しました。", "src": ["教科書② p.238「イタリアとドイツの降伏」"], "mode": "normal", "difficulty": "通常"}, {"id": 51, "unit": "太平洋戦争", "type": "choice", "q": "日本が南進を進めた大きな目的の一つは何？", "choices": ["石油などの資源を確保するため", "ヨーロッパへ移住するため", "国際連盟に復帰するため", "アメリカへ農産物を輸出するため"], "answer": 0, "ex": "日中戦争の長期化で資源確保が重要となり、日本は東南アジアへ南進しました。", "src": ["教科書① p.128-129「第二次世界大戦と日本・アメリカ」", "教科書② p.234"], "mode": "normal", "difficulty": "通常"}, {"id": 52, "unit": "太平洋戦争", "type": "text", "q": "アメリカ・イギリス・中国・オランダによる日本への経済的圧力を表す呼称を答えよ。", "answers": ["ABCD包囲陣", "ABCD包囲網"], "ex": "日本では、アメリカ・イギリス・中国・オランダの頭文字からABCD包囲陣（包囲網）と呼びました。", "src": ["教科書① p.128-129", "教科書② p.234-235"], "mode": "normal", "difficulty": "通常"}, {"id": 53, "unit": "太平洋戦争", "type": "choice", "q": "アメリカの対日経済制裁で、日本に特に深刻な影響を与えたものはどれ？", "choices": ["石油輸出の停止", "綿花輸出の増加", "自動車輸入の自由化", "米の輸入拡大"], "answer": 0, "ex": "日本は石油を輸入に大きく依存していたため、アメリカの石油輸出停止は大きな圧力となりました。", "src": ["教科書② p.235「日米交渉の決裂」"], "mode": "normal", "difficulty": "通常"}, {"id": 54, "unit": "太平洋戦争", "type": "text", "q": "1941年12月8日、日本軍が攻撃したハワイのアメリカ軍基地を答えよ。", "answers": ["真珠湾", "パールハーバー", "真珠湾基地"], "ex": "日本軍の真珠湾攻撃などをきっかけに太平洋戦争が始まりました。", "src": ["教科書② p.234-235「太平洋戦争の開始」"], "mode": "normal", "difficulty": "通常"}, {"id": 55, "unit": "太平洋戦争", "type": "text", "q": "日本が欧米の植民地支配を打破しアジア諸民族が共に繁栄すると掲げた構想を何という？", "answers": ["大東亜共栄圏"], "ex": "日本は大東亜共栄圏の建設を掲げましたが、占領地では厳しい統制や物資徴発も行われました。", "src": ["教科書② p.234-237"], "mode": "normal", "difficulty": "通常"}, {"id": 56, "unit": "太平洋戦争", "type": "text", "q": "1942年6月、日本海軍が大きな損害を受け、太平洋戦争の転換点となった海戦を答えよ。", "answers": ["ミッドウェー海戦"], "ex": "ミッドウェー海戦以降、アメリカ側の反攻が強まり、日本は次第に劣勢となりました。", "src": ["教科書② p.235"], "mode": "normal", "difficulty": "通常"}, {"id": 57, "unit": "太平洋戦争", "type": "choice", "q": "太平洋戦争初期の戦況として正しいものはどれ？", "choices": ["日本が東南アジアや太平洋の広い地域を占領した", "日本は開戦直後から本土を占領された", "日本は南進を中止した", "アメリカは参戦しなかった"], "answer": 0, "ex": "戦争初期、日本軍は短期間に広い地域を占領しました。", "src": ["教科書② p.235「太平洋戦争の始まり」"], "mode": "normal", "difficulty": "通常"}, {"id": 58, "unit": "太平洋戦争", "type": "text", "q": "1944年、日本本土がアメリカ軍の大型爆撃機の攻撃圏内に入る大きな要因となった島の陥落を答えよ。", "answers": ["サイパン島", "サイパン"], "ex": "サイパン島の陥落によって、日本本土への空襲が本格化しました。", "src": ["教科書② p.238「空襲と沖縄戦」"], "mode": "normal", "difficulty": "通常"}, {"id": 59, "unit": "太平洋戦争", "type": "text", "q": "1945年3月に多数の民間人が犠牲となった、日本の首都への大規模空襲を何という？", "answers": ["東京大空襲"], "ex": "1945年3月10日の東京大空襲では多数の民間人が死亡しました。", "src": ["教科書② p.238「空襲と沖縄戦」"], "mode": "normal", "difficulty": "通常"}, {"id": 60, "unit": "太平洋戦争", "type": "choice", "q": "沖縄戦について正しい説明はどれ？", "choices": ["多数の沖縄住民を巻き込む激しい地上戦となった", "日本本土ではなくヨーロッパで行われた", "1941年に終わった", "民間人被害はほとんどなかった"], "answer": 0, "ex": "1945年の沖縄戦では軍民多数が犠牲となり、住民の被害も非常に大きくなりました。", "src": ["教科書② p.238-239「空襲と沖縄戦」"], "mode": "normal", "difficulty": "通常"}, {"id": 61, "unit": "戦時下の人々", "type": "text", "q": "国家が兵士だけでなく、産業・労働力・物資・国民生活全体を戦争に投入する戦争を何という？", "answers": ["総力戦"], "ex": "第二次世界大戦は、社会全体を動員する総力戦でした。", "src": ["教科書② p.236-237「戦時下の人々」"], "mode": "normal", "difficulty": "通常"}, {"id": 62, "unit": "戦時下の人々", "type": "text", "q": "大学生などの徴兵猶予を停止し、学生を軍隊へ送ったことを何という？", "answers": ["学徒出陣"], "ex": "戦争末期、文科系学生などにも徴兵が及び、学徒出陣が行われました。", "src": ["教科書② p.236「国民の動員」"], "mode": "normal", "difficulty": "通常"}, {"id": 63, "unit": "戦時下の人々", "type": "text", "q": "中学生や女学生などが軍需工場で働かされたことを何という？", "answers": ["勤労動員"], "ex": "兵力不足・労働力不足を補うため、学生も軍需工場などへ勤労動員されました。", "src": ["教科書② p.236「国民の動員」"], "mode": "normal", "difficulty": "通常"}, {"id": 64, "unit": "戦時下の人々", "type": "text", "q": "都市の児童を空襲から守るため、地方へ移動させたことを何という？", "answers": ["学童疎開"], "ex": "本土空襲が激しくなると、都市の小学生を地方へ移す学童疎開が行われました。", "src": ["教科書② p.236-237"], "mode": "normal", "difficulty": "通常"}, {"id": 65, "unit": "戦時下の人々", "type": "choice", "q": "戦時中、鍋や釜、寺の鐘などまで回収された主な理由は？", "choices": ["兵器生産に使う金属を確保するため", "美術館へ展示するため", "農業生産を増やすため", "輸出するため"], "answer": 0, "ex": "軍需品の生産が優先され、生活用品の金属も兵器材料として回収されました。", "src": ["教科書② p.236「国民の動員」"], "mode": "normal", "difficulty": "通常"}, {"id": 66, "unit": "戦時下の人々", "type": "text", "q": "食料や衣料などの不足に対して、一定量を割り当てて供給する制度を何という？", "answers": ["配給制", "配給制度"], "ex": "戦時中は生活物資が不足し、食料や衣料などに配給制が導入されました。", "src": ["教科書② p.236-237"], "mode": "normal", "difficulty": "通常"}, {"id": 67, "unit": "戦時下の人々", "type": "choice", "q": "戦時中のマスメディアについて正しいものはどれ？", "choices": ["政府の統制下に置かれ、戦争協力を促す宣伝にも使われた", "完全な報道の自由が保障された", "新聞やラジオはすべて廃止された", "国外の放送だけが許可された"], "answer": 0, "ex": "新聞・ラジオなどは情報統制の対象となり、戦況や戦争協力に関する宣伝にも利用されました。", "src": ["教科書② p.236-237"], "mode": "normal", "difficulty": "通常"}, {"id": 68, "unit": "戦時下の人々", "type": "choice", "q": "日本の植民地・占領地で行われたこととして適切なものはどれ？", "choices": ["労働力や兵力の動員、物資の徴発", "完全な自治の保障のみ", "日本軍の即時撤退", "徴兵や労働動員の全面禁止"], "answer": 0, "ex": "朝鮮・台湾などでは徴兵や労働動員が進み、占領地でも物資徴発などが行われました。", "src": ["教科書② p.237「植民地と占領地」"], "mode": "normal", "difficulty": "通常"}, {"id": 69, "unit": "戦時下の人々", "type": "choice", "q": "戦時中、日本の占領地で抵抗運動が広がった理由として最も適切なものは？", "choices": ["厳しい統制や物資徴発などへの反発", "自由な選挙が増えたから", "税負担がすべてなくなったから", "占領がすぐに終わったから"], "answer": 0, "ex": "占領地での厳しい統制・徴発・労働動員などに対する反発から抵抗運動が起こりました。", "src": ["教科書② p.237"], "mode": "normal", "difficulty": "通常"}, {"id": 70, "unit": "戦時下の人々", "type": "text", "q": "沖縄戦で看護要員などとして動員された女子学徒隊として有名なものを答えよ。", "answers": ["ひめゆり学徒隊"], "ex": "沖縄戦ではひめゆり学徒隊など、学徒も戦場に動員されました。", "src": ["教科書② p.239「ひめゆり学徒隊」"], "mode": "normal", "difficulty": "通常"}, {"id": 71, "unit": "戦争の終結", "type": "text", "q": "1945年7月、連合国が日本に降伏を求めて発表した宣言を答えよ。", "answers": ["ポツダム宣言"], "ex": "ポツダム宣言は日本軍の無条件降伏などを求めました。", "src": ["教科書② p.239「日本の降伏」"], "mode": "normal", "difficulty": "通常"}, {"id": 72, "unit": "戦争の終結", "type": "text", "q": "広島に原子爆弾が投下された年月日を答えよ。", "answers": ["1945年8月6日", "8月6日", "1945/8/6"], "ex": "1945年8月6日、アメリカは広島に原子爆弾を投下しました。", "src": ["教科書② p.239「日本の降伏」"], "mode": "normal", "difficulty": "通常"}, {"id": 73, "unit": "戦争の終結", "type": "text", "q": "長崎に原子爆弾が投下された年月日を答えよ。", "answers": ["1945年8月9日", "8月9日", "1945/8/9"], "ex": "1945年8月9日、長崎にも原子爆弾が投下されました。", "src": ["教科書② p.239「日本の降伏」"], "mode": "normal", "difficulty": "通常"}, {"id": 74, "unit": "戦争の終結", "type": "choice", "q": "1945年8月、ソ連が日本に宣戦するまで日本とソ連の間にあった条約は？", "choices": ["日ソ中立条約", "独ソ不可侵条約", "日英同盟", "日独伊三国同盟"], "answer": 0, "ex": "日本とソ連の間には日ソ中立条約がありましたが、1945年8月にソ連は対日参戦しました。", "src": ["教科書② p.239"], "mode": "normal", "difficulty": "通常"}, {"id": 75, "unit": "戦争の終結", "type": "text", "q": "1945年8月15日、天皇がラジオで国民に敗戦を伝えた放送を何という？", "answers": ["玉音放送"], "ex": "8月15日の玉音放送によって、ポツダム宣言受諾が国民に伝えられました。", "src": ["教科書② p.239「日本の降伏」"], "mode": "normal", "difficulty": "通常"}, {"id": 76, "unit": "戦争の終結", "type": "choice", "q": "日本がポツダム宣言受諾を決定した日はどれ？", "choices": ["1945年8月14日", "1945年8月6日", "1945年7月26日", "1945年9月2日"], "answer": 0, "ex": "日本政府は8月14日にポツダム宣言受諾を決定し、翌15日に国民 : "世界恐慌と各国の対応", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "同じドイツ失業率グラフで、1938年の失業率は約何％？", "answers": ["1.9%", "1.9％"], "ex": "1938年には1.9％まで低下しています。", "src": ["教科書① p.119 図7"]}, {"id": 201, "unit": "ファシズムと軍部の台頭", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ナチスのポスターに大きく示されている失業者数は？", "choices": ["500万人", "50万人", "1000万人", "5万人"], "answer": 0, "ex": "ナチスのポスターには「500万人の失業者」とあります。", "src": ["教科書① p.119 図5"]}, {"id": 202, "unit": "ファシズムと軍部の台頭", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1933年、ヒトラーに強大な権限を与えた法律を何という？", "answers": ["全権委任法"], "ex": "全権委任法によって議会を経ずに立法できる権限が与えられ、独裁が強まりました。", "src": ["教科書① p.119"]}, {"id": 203, "unit": "ファシズムと軍部の台頭", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ソ連の1928年開始の第1次五か年計画で、本格的に進められたのは何？", "choices": ["社会主義経済の建設と工業化", "植民地拡大", "金本位制復帰", "自由放任"], "answer": 0, "ex": "五か年計画では社会主義経済の建設、とくに工業化が進められました。", "src": ["教科書① p.120 欄外"]}, {"id": 204, "unit": "ファシズムと軍部の台頭", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1935年、コミンテルン第7回大会で打ち出された反ファシズムの共同戦線を何という？", "answers": ["人民戦線"], "ex": "コミンテルンはファシズムに反対する人民戦線の結成を呼びかけました。", "src": ["教科書① p.120"]}, {"id": 205, "unit": "ファシズムと軍部の台頭", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1938年、英・仏・独・伊の4か国首脳が集まった会談を何という？", "answers": ["ミュンヘン会談"], "ex": "ズデーテン地方問題をめぐりミュンヘン会談が開かれました。", "src": ["教科書① p.121"]}, {"id": 206, "unit": "ファシズムと軍部の台頭", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ミュンヘン会談の風刺画で、会談に参加していないのに当事国だった国は？", "choices": ["チェコスロバキア", "スペイン", "ポルトガル", "スイス"], "answer": 0, "ex": "チェコスロバキア当事国抜きで英仏独伊が話し合った点が風刺されています。", "src": ["教科書① p.121 図16"]}, {"id": 207, "unit": "ファシズムと軍部の台頭", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1936年に日本とドイツが結び、翌年イタリアも加わった協定は？", "answers": ["日独防共協定"], "ex": "日独防共協定は1936年に結ばれ、1937年にイタリアが加わりました。", "src": ["教科書① p.125"]}, {"id": 208, "unit": "日中戦争と戦時体制", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "満州国の宣伝画に掲げられた、5民族の協調を示す語は？", "answers": ["五族協和"], "ex": "満州国は「五族協和」を掲げました。", "src": ["教科書① p.124 図11"]}, {"id": 209, "unit": "日中戦争と戦時体制", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "満州国の人口構成図で圧倒的多数を占める民族は？", "choices": ["漢人", "日本人", "モンゴル人", "朝鮮人"], "answer": 0, "ex": "1940年の図では漢人が85.3％を占めています。", "src": ["教科書① p.124 図12"]}, {"id": 210, "unit": "日中戦争と戦時体制", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "満州国の人口構成図で漢人が占める割合は何％？", "answers": ["85.3%", "85.3％"], "ex": "図では漢人85.3％と示されています。", "src": ["教科書① p.124 図12"]}, {"id": 211, "unit": "日中戦争と戦時体制", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "満州国の国旗の写真が載るページで、元首として紹介される清朝最後の皇帝は？", "answers": ["溥儀"], "ex": "溥儀は1932年に満州国の執政、1934年に皇帝となりました。", "src": ["教科書① p.124-125"]}, {"id": 212, "unit": "日中戦争と戦時体制", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "中国への物資輸送路として地図に示されるルートを何という？", "answers": ["援蒋ルート"], "ex": "国民政府を支援する物資輸送路は援蒋ルートと呼ばれます。", "src": ["教科書① p.125 図16"]}, {"id": 213, "unit": "日中戦争と戦時体制", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "日本が国際連盟脱退を通告したのは1933年だが、脱退が発効したのは何年？", "choices": ["1935年", "1933年", "1934年", "1937年"], "answer": 0, "ex": "本文には1935年に脱退が発効したとあります。", "src": ["教科書① p.125"]}, {"id": 214, "unit": "日中戦争と戦時体制", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1937年、国民党と共産党の協力で成立した対日統一戦線の名称は？", "answers": ["抗日民族統一戦線"], "ex": "第二次国共合作により抗日民族統一戦線が成立しました。", "src": ["教科書① p.125"]}, {"id": 215, "unit": "日中戦争と戦時体制", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "二・二六事件で反乱軍を「反乱軍」として鎮圧する方針を明確にした人物として本文に出るのは？", "choices": ["昭和天皇", "犬養毅", "東条英機", "西園寺公望"], "answer": 0, "ex": "教科書では昭和天皇が反乱軍として処置するよう強く批判したことが記されています。", "src": ["教科書① p.125 欄外"]}, {"id": 216, "unit": "第二次世界大戦", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1939年8月、ドイツとソ連が結んだ条約を何という？", "answers": ["独ソ不可侵条約"], "ex": "第二次世界大戦直前、ドイツとソ連は独ソ不可侵条約を結びました。", "src": ["教科書① p.127"]}, {"id": 217, "unit": "第二次世界大戦", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "フランス敗北後、南部でドイツに協力した政権を一般に何政権という？", "answers": ["ヴィシー政権", "ビシー政権"], "ex": "フランス南部にはドイツに協力するヴィシー政権が成立しました。", "src": ["教科書① p.127"]}, {"id": 218, "unit": "第二次世界大戦", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1940年5月、イギリス首相となりドイツへの抵抗を続けた人物は？", "answers": ["チャーチル", "ウィンストン・チャーチル"], "ex": "チャーチルは徹底抗戦を訴えました。", "src": ["教科書① p.127"]}, {"id": 219, "unit": "第二次世界大戦", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1941年3月、アメリカがイギリスなどへの武器供与を可能にした法律を何という？", "answers": ["武器貸与法", "レンドリース法"], "ex": "武器貸与法によってアメリカは連合国側への支援を強めました。", "src": ["教科書① p.128"]}, {"id": 220, "unit": "第二次世界大戦", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "大西洋憲章を発表した組み合わせは？", "choices": ["ローズベルトとチャーチル", "ヒトラーとムッソリーニ", "スターリンと蒋介石", "トルーマンとアトリー"], "answer": 0, "ex": "1941年8月、ローズベルトとチャーチルが大西洋憲章を発表しました。", "src": ["教科書① p.128"]}, {"id": 221, "unit": "太平洋戦争", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "日本が中国国民政府への英米の支援を断とうとした物資輸送路を何という？", "answers": ["援蒋ルート"], "ex": "東南アジア進出には援蒋ルート遮断の狙いもありました。", "src": ["教科書① p.128"]}, {"id": 222, "unit": "太平洋戦争", "type": "text", "mode": "hentai", "difficulty": "変態", "q": "1941年11月26日、アメリカが日本に提示した文書を何という？", "answers": ["ハルノート", "ハル・ノート"], "ex": "ハル国務長官が提示したハルノートは日米交渉決裂の重要な局面です。", "src": ["教科書① p.129"]}, {"id": 223, "unit": "太平洋戦争", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "教科書の日本・アメリカの国力比較で、日本に対しアメリカの石油産出量はおよそ何倍？", "choices": ["約780倍", "約8倍", "約78倍", "約78,000倍"], "answer": 0, "ex": "図では石油産出量の格差が極端に大きく、約780倍と読み取れます。", "src": ["教科書② p.235 図6"]}, {"id": 224, "unit": "太平洋戦争", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ミッドウェー海戦で日本が失った主力空母の数として教科書が示すのは？", "choices": ["4隻", "1隻", "2隻", "8隻"], "answer": 0, "ex": "写真説明では日本は主力空母4隻などを失ったとされています。", "src": ["教科書① p.130 図20"]}, {"id": 225, "unit": "太平洋戦争", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ミッドウェー海戦の敗北について、当時の日本国民にはどう伝えられた？", "choices": ["実際より軽い損害として伝えられた", "完全勝利とだけ伝えられた", "何も報道されなかった", "米軍側の損害だけ正確に伝えられた"], "answer": 0, "ex": "教科書の新聞資料 "q": "1930年代のドイツで、公共事業の例として写真に出るものは？", "choices": ["高速道路（アウトバーン）の建設", "運河の全面撤去", "地下鉄の廃止", "農地の放棄"], "answer": 0, "ex": "教科書にはアウトバーン建設の写真が載っています。", "src": ["教科書① p.119 図10"]}, {"id": 252, "unit": "日中戦争と戦時体制", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "満州事変後、日本政府の方針に反して軍事行動を拡大した部隊は？", "choices": ["関東軍", "近衛師団", "海軍陸戦隊だけ", "国際連盟軍"], "answer": 0, "ex": "関東軍が政府の不拡大方針を無視して占領を拡大しました。", "src": ["教科書① p.124-125／教科書② p.228"]}, {"id": 253, "unit": "戦争の終結", "type": "choice", "mode": "hentai", "difficulty": "変態", "q": "ポツダム宣言発表時の首脳会談の開催地はどこ？", "choices": ["ポツダム", "ヤルタ", "カイロ", "テヘラン"], "answer": 0, "ex": "ポツダム会談の成果としてポツダム宣言が発表されました。", "src": ["教科書① p.131"]}];
const el=id=>document.getElementById(id);
let set=[],idx=0,judged=new Map(),wrongIds=[];

for(const u of [...new Set(QUESTIONS.map(q=>q.unit))]){
 const o=document.createElement('option');o.value=u;o.textContent=u;el('unit').appendChild(o);
}

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function normalize(s){return String(s).trim().replace(/[・･\s＝=（）()「」『』,，.．]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/％/g,'%').toLowerCase()}
function pool(){
 const mode=el('mode').value;
 return QUESTIONS.filter(q=>(mode==='mix'||q.mode===mode)&&(el('unit').value==='all'||q.unit===el('unit').value)&&(el('type').value==='all'||q.type===el('type').value));
}
function updatePool(){
 const p=pool(), n=p.filter(q=>q.mode==='normal').length, h=p.filter(q=>q.mode==='hentai').length;
 el('poolInfo').textContent=`現在の条件：${p.length}問（通常 ${n}問／変態 ${h}問）`;
}
['mode','unit','type'].forEach(id=>el(id).addEventListener('change',updatePool));

function choose(){
 let p=pool();
 const n=el('count').value==='all'?p.length:Math.min(Number(el('count').value),p.length);
 return shuffle(p).slice(0,n);
}
function begin(custom=null){
 set=custom?shuffle(custom):choose();idx=0;judged=new Map();wrongIds=[];
 el('result').classList.add('hidden');el('stats').classList.remove('hidden');show();update();
 window.scrollTo({top:0,behavior:'smooth'});
}
function show(){
 const screen=el('screen');screen.innerHTML='';
 if(!set.length){screen.innerHTML='<section class="card">条件に合う問題がありません。</section>';return}
 const q=set[idx],card=document.createElement('section');card.className='card';
 card.innerHTML=`<div class="topline"><div class="badges"><span class="badge">${q.unit}</span><span class="badge">${q.type==='choice'?'四択':'記述'}</span>${q.mode==='hentai'?'<span class="badge hard">変態</span>':''}</div><span class="count">第 ${idx+1} 問 / ${set.length} 問</span></div><h2>${q.q}</h2><div id="answerArea"></div><div id="fb"></div><div id="next" class="next"></div>`;
 screen.appendChild(card);
 const area=card.querySelector('#answerArea');
 if(q.type==='choice'){
   const box=document.createElement('div');box.className='choices';
   q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>judgeChoice(q,i,card);box.appendChild(b)});
   area.appendChild(box);
 }else{
   const row=document.createElement('div');row.className='textrow';
   const inp=document.createElement('input');inp.placeholder='答えを入力';
   const b=document.createElement('button');b.textContent='答え合わせ';b.onclick=()=>judgeText(q,inp.value,card);
   inp.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()});
   row.append(inp,b);area.appendChild(row);setTimeout(()=>inp.focus(),30);
 }
}
function lock(card){card.querySelectorAll('#answerArea button,#answerArea input').forEach(x=>x.disabled=true)}
function reveal(q,ok,card){
 const ans=q.type==='choice'?q.choices[q.answer]:q.answers[0];
 card.querySelector('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ng'}"><strong>${ok?'正解！':'不正解'}</strong>${ok?'':`<div>正答：<b>${ans}</b></div>`}<div>${q.ex}</div><div class="source"><b>教科書：</b>${q.src.join(' ／ ')}</div></div>`;
 const b=document.createElement('button');b.textContent=idx===set.length-1?'結果を見る':'次の問題';b.onclick=next;card.querySelector('#next').appendChild(b);
}
function judgeChoice(q,i,card){
 if(judged.has(q.id))return;const ok=i===q.answer;judged.set(q.id,ok);
 const bs=[...card.querySelectorAll('.choice')];bs[q.answer].classList.add('correct');if(!ok)bs[i].classList.add('wrong');
 lock(card);reveal(q,ok,card);update();
}
function judgeText(q,t,card){
 if(judged.has(q.id))return;
 const n=normalize(t);
 const ok=q.answers.some(a=>{const x=normalize(a);return n===x||(x.length>=4&&n.includes(x))||(n.length>=4&&x.includes(n))});
 judged.set(q.id,ok);lock(card);reveal(q,ok,card);update();
}
function update(){
 const vals=[...judged.values()],c=vals.filter(Boolean).length,w=vals.length-c;
 el('pos').textContent=`${Math.min(idx+1,set.length)} / ${set.length}`;el('ok').textContent=c;el('ng').textContent=w;el('rate').textContent=vals.length?Math.round(c/vals.length*100)+'%':'0%';
}
function next(){if(idx<set.length-1){idx++;show();update();window.scrollTo({top:el('screen').offsetTop-15,behavior:'smooth'})}else finish()}
function finish(){
 const vals=[...judged.values()],c=vals.filter(Boolean).length,w=vals.length-c;
 wrongIds=set.filter(q=>judged.get(q.id)===false).map(q=>q.id);
 localStorage.setItem('socialQuizWrongExtreme',JSON.stringify(wrongIds));
 el('screen').innerHTML='';el('result').classList.remove('hidden');
 el('resultText').textContent=`${set.length}問中 ${c}問正解（正答率 ${Math.round(c/set.length*100)}%）／ 不正解 ${w}問`;
 el('wrongOnly').disabled=!w;
}
el('start').onclick=()=>begin();
el('again').onclick=()=>begin();
el('wrongOnly').onclick=()=>begin(QUESTIONS.filter(q=>wrongIds.includes(q.id)));
el('previousWrong').onclick=()=>{
 const ids=JSON.parse(localStorage.getItem('socialQuizWrongExtreme')||'[]'),list=QUESTIONS.filter(q=>ids.includes(q.id));
 if(!list.length){alert('前回の間違い問題はまだ保存されていません。');return}begin(list);
};
updatePool();
begin();
</script>
</body>
</html>
